name: Daily Stock Data Update
on:
  schedule:
    - cron: '30 6 * * 1-5'
    - cron: '30 12 * * 1-5'
    - cron: '0 14 * * 1-5'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Update stock database
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          if [ "${{ github.event.schedule }}" = "30 6 * * 1-5" ]; then
            python stock_db.py --prices-only
          else
            python stock_db.py
          fi
      - name: Keepalive (prevent 60-day auto-disable)
        if: github.event_name == 'schedule'
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/update_stocks.yml/enable
        env:
          GH_TOKEN: ${{ github.token }}
